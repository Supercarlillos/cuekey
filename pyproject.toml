[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuekey"
version = "0.8.5"
description = "Free DJ track analysis: musical key (Camelot/Open Key), BPM, energy level and automatic cue points, with rekordbox XML integration."
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.11"
authors = [{ name = "Supercarlillos" }]
keywords = ["dj", "harmonic-mixing", "key-detection", "bpm", "rekordbox", "camelot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "mutagen>=1.47",
    "click>=8.1",
    "rich>=13.0",
    "pywebview>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pillow>=10.0",  # icon generation (packaging/make_icon.py)
]

[project.scripts]
cuekey = "cuekey.cli:main"

[project.gui-scripts]
cuekey-gui = "cuekey.gui:main"

[project.urls]
Homepage = "https://github.com/Supercarlillos/cuekey"
Changelog = "https://github.com/Supercarlillos/cuekey/blob/main/CHANGELOG.md"
Issues = "https://github.com/Supercarlillos/cuekey/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cuekey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/cuekey"]
